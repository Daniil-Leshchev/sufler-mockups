<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Подсказка ответа · вариант 1 · карточка</title>
<style>
:root{
  --bg:#141414; --top:#1d1d1d; --panel:#1b1b1b; --head:#262626; --side:#1b1b1b; --params:#222;
  --line:#2c2c2c; --line-2:#383838;
  --field:#2a2a2a; --field-line:#3b3b3b;
  --text:#e8e8e8; --text-2:#cfcfcf; --muted:#9b9b9b; --faint:#7a7a7a;
  --link:#3d9bff;
  --staff:#1f4fc0; --od-send:#2f6fe0;
  --accent:#8a92ff; --accent-btn:#5a63de; --accent-btn-h:#6971ec;
  --accent-soft:rgba(138,146,255,.16); --accent-line:rgba(138,146,255,.55); --accent-ring:rgba(138,146,255,.28);
  --ok:#5bd68e; --ok-bg:rgba(91,214,142,.13); --ok-line:rgba(91,214,142,.36);
  --warn:#f2c65c; --warn-bg:rgba(242,198,92,.11); --warn-line:rgba(242,198,92,.36);
  --bad:#ff7d70; --bad-bg:rgba(255,125,112,.12); --bad-line:rgba(255,125,112,.4);
  --info:#86b6ff; --info-bg:rgba(134,182,255,.11); --info-line:rgba(134,182,255,.36);
  --wait:#b4b4b4; --wait-bg:rgba(255,255,255,.07);
  --side-w:296px; --params-w:250px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-width:1280px;background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:52px}
body.static{padding-bottom:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
[hidden]{display:none!important}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lnk{color:var(--link);text-decoration:none;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.lnk:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:#4a4a4a transparent}

/* ---------- верхняя полоса ---------- */
.topbar{height:48px;background:var(--top);border-bottom:1px solid #262626}
.topbar-in{max-width:1760px;height:100%;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:20px}
.menu{display:flex;gap:20px}
.menu a{color:var(--link);font-size:13.5px;font-weight:700;text-decoration:none;cursor:default}
.menu a.active{color:#f0f0f0}
.tools{margin-left:auto;display:flex;gap:4px;align-items:center}
.tb{width:28px;height:28px;border-radius:3px;background:#2b2b2b;border:0;color:#e6e6e6;display:grid;place-items:center}
.tb .ico{width:16px;height:16px}
.tb.g{background:#1fa83a;color:#fff}
.tb.o{background:#f08a1c;color:#fff}
.tb-gap{width:10px}
.me{display:flex;align-items:center;gap:6px;background:#2b2b2b;border-radius:3px;padding:3px 7px 3px 3px;margin-left:8px}
.me b{width:22px;height:22px;border-radius:2px;background:#1f8fe0;color:#fff;font-size:11px;display:grid;place-items:center}
.me i{width:12px;height:12px;border-radius:50%;background:#ff3b30}

/* ---------- страница обращения ---------- */
.page{max-width:1760px;margin:0 auto;padding:24px 16px 16px;height:calc(100vh - 48px - 52px);min-height:620px}
body.static .page{height:calc(100vh - 48px)}
.case{height:100%;background:var(--panel);border:1px solid #262626;display:grid;grid-template-columns:var(--params-w) minmax(0,1fr) var(--side-w);grid-template-rows:36px minmax(0,1fr) 36px;overflow:hidden}
.p-head{grid-area:1/1;background:var(--head);display:flex;align-items:center;padding:0 16px;font-size:12px;color:#e2e2e2;text-transform:uppercase;letter-spacing:.01em;border-right:1px solid #1a1a1a}
.c-head{grid-area:1/2/2/4;display:flex;align-items:center;background:var(--head);min-width:0}
.c-title{display:flex;align-items:center;gap:10px;padding:0 14px;min-width:0;flex:1}
.vk{width:18px;height:14px;border-radius:3px;background:#9a9a9a;color:#262626;font-size:8.5px;font-weight:800;display:grid;place-items:center;flex:none;letter-spacing:-.02em}
.c-title b{font-size:12.5px;font-weight:700;color:#f0f0f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-status{color:#a8a8a8;font-size:12.5px;text-transform:uppercase;letter-spacing:.02em;padding:0 16px;white-space:nowrap}
.c-icons{display:flex;height:100%}
.c-icons button{width:36px;border:0;border-left:1px solid #1a1a1a;background:none;color:#e6e6e6;display:grid;place-items:center}
.c-icons button.b{color:var(--link)}
.c-icons .ico{width:17px;height:17px}

.params{grid-area:2/1;background:var(--params);overflow:auto;padding:12px 16px;border-right:1px solid #1a1a1a}
.fld{margin-bottom:12px}
.fld-l{display:flex;justify-content:space-between;color:#a2a2a2;font-size:12.5px;margin-bottom:4px}
.fld-l span{color:#cfcfcf}
.sel{min-height:26px;border:1px solid var(--field-line);border-radius:2px;background:var(--field);display:flex;align-items:center;gap:6px;padding:2px 8px;font-size:12.5px;color:#e6e6e6}
.sel .grow{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel>.ico{color:#8d8d8d;width:12px;height:12px}
.sel.green .grow{color:#3fd25a}
.sel.orange .grow{color:#ff7a3a}
.sel .okd{width:13px;height:13px;border-radius:50%;background:#2ec04f;display:grid;place-items:center;flex:none}
.sel .okd .ico{width:9px;height:9px;color:#fff;stroke-width:2.6}
.sel .clk{color:#f2b23a}
.tagchip{display:inline-flex;align-items:center;gap:6px;color:#f0f0f0;font-weight:600}
.tagchip .ico{width:11px;height:11px;color:#bbb}
.p-sep{border:0;border-top:1px solid #2e2e2e;margin:2px -16px 12px}

.conv{grid-area:2/2;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel)}
.side{grid-area:2/3;overflow-y:auto;min-height:0;background:var(--side);border-left:1px solid #222}
.f-left{grid-area:3/1;background:var(--head);display:flex;align-items:center;padding:0 16px;color:#e6e6e6;font-size:13px;text-transform:uppercase;border-right:1px solid #1a1a1a}
.f-main{grid-area:3/2/4/4;background:var(--head);display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 16px}
.f-main .lbl{color:#e6e6e6;font-size:13px;margin-right:4px}
.st-b{height:22px;border:0;border-radius:2px;background:#3c3c3c;color:#f0f0f0;font-size:11.5px;font-weight:700;padding:0 8px}
.st-b.on{background:#e0742e}
.save{border:0;background:none;color:#7b7b7b;text-transform:uppercase;font-size:12.5px;margin-left:36px;letter-spacing:.01em}

/* ---------- лента ---------- */
.feed{flex:1;overflow-y:auto;padding:14px 16px 10px;display:flex;flex-direction:column;gap:6px;min-height:0}
.prev,.day{background:#141414;text-align:center;padding:9px;font-size:13px;color:#e0e0e0;flex:none}
.prev .lnk{font-size:13px}
.prev span{color:#9a9a9a}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) 70px;gap:10px;align-items:start;flex:none}
.av{width:34px;height:34px;border-radius:3px;display:grid;place-items:center;font-size:12px;font-weight:700}
.av.cl{background:#5d5d5d;color:#f2f2f2;border-radius:50%}
.av.st{background:#6b4fc8;color:#fff}
.av.gear{background:#d6d6d6;color:#9a9a9a;width:30px;height:30px;margin:2px}
.av.gear .ico{width:18px;height:18px}
.tm{background:#2b2b2b;color:#e6e6e6;font-size:12.5px;text-align:center;padding:7px 0;border-radius:3px}
.bub{display:inline-block;max-width:100%;padding:8px 11px;border-radius:3px;font-size:13px;line-height:1.45;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.row.in .bub{background:#3a3a3a;color:#f4f4f4}
.row.out .bub,.row.bot .bub{background:var(--staff);color:#fff}
.bub .ticks{display:inline-flex;vertical-align:-3px;margin-left:6px;color:#7fb4ff}
.bub .ticks .ico{width:15px;height:15px}
.row.ev{background:#1f1f1f;padding:6px 0;align-items:center}
.row.ev .ev-t{font-size:12px;color:#d8d8d8;line-height:1.45}
.row.ev .ev-t b{color:#fff}
.row.ev .ev-tm{font-size:12.5px;font-weight:700;color:#ececec;text-align:right;padding-right:8px;align-self:start;padding-top:2px}
.row.enter{animation:msgIn .45s cubic-bezier(.2,.7,.2,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- поле ответа ---------- */
.composer{padding:8px 16px 12px}
.reply-box{background:#252525;border:1px solid #2e2e2e;border-radius:3px;transition:border-color .2s,box-shadow .2s}
.reply-box textarea{display:block;width:100%;border:0;outline:0;resize:none;padding:10px 12px;font:inherit;font-size:13.5px;line-height:1.4;min-height:80px;max-height:180px;background:transparent;color:#f0f0f0;transition:transform .26s ease,opacity .26s ease}
.reply-box textarea::placeholder{color:#8e8e8e}
.reply-box.flash{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.reply-box.fly textarea{transform:translateY(-18px);opacity:0}
.reply-tools{display:flex;align-items:center;border-top:1px solid #333;height:38px}
.reply-tools .rt{width:38px;height:38px;border:0;border-right:1px solid #333;background:none;color:#e6e6e6;display:grid;place-items:center}
.reply-tools .rt .ico{width:17px;height:17px}
.reply-hint{margin-left:auto;color:#c2c2c2;font-size:12.5px;margin-right:10px;white-space:nowrap}
.timer{width:28px;height:28px;border:0;background:#5a5a5a;color:#fff;border-radius:2px 0 0 2px;display:grid;place-items:center}
.timer .ico{width:14px;height:14px}
.od-send{height:28px;padding:0 16px;border:0;background:#3f3f3f;color:#929292;text-transform:uppercase;font-weight:700;font-size:12px;letter-spacing:.02em;border-radius:0 2px 2px 0;margin-right:6px;transition:background .2s,color .2s}
.od-send:not(:disabled){background:var(--od-send);color:#fff}

/* ---------- полоса над полем ответа (вариант 2) ---------- */
.strip{display:flex;align-items:center;gap:8px;min-height:36px;padding:4px 6px 4px 10px;border-radius:3px;margin-bottom:6px;font-size:12.5px;border:1px solid;animation:fadeIn .25s ease}
.strip>.ico{width:14px;height:14px}
.strip b{font-weight:650}
.strip .dim{color:#a9a9a9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .sp{flex:1}
.strip.ready,.strip.guard{background:var(--accent-soft);border-color:var(--accent-line);color:#c9cdff}
.strip.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.strip.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.strip.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.strip.wait{background:#222;border-color:#333;color:#c8c8c8}

/* ---------- кнопки ---------- */
.btn{height:30px;border-radius:4px;border:1px solid #474747;background:#2e2e2e;padding:0 11px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:#ececec;white-space:nowrap;transition:background .15s,border-color .15s,opacity .15s}
.btn:hover:not(:disabled){background:#383838}
.btn .ico{width:13px;height:13px}
.btn.primary{background:var(--accent-btn);border-color:var(--accent-btn);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent-btn-h)}
.btn:disabled{opacity:.45}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.xs{height:26px;padding:0 10px;font-size:12px;border-radius:3px}
.spin{width:11px;height:11px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{50%{opacity:.35}}

/* ---------- правая колонка: подсказка ---------- */
.side-in{padding:10px 8px 24px}
.hc{background:#232323;border:1px solid var(--accent-line);border-radius:6px;margin-bottom:12px;box-shadow:0 0 0 3px rgba(138,146,255,.06)}
.hc-top{display:flex;align-items:center;gap:6px;padding:8px 6px 6px 10px;cursor:pointer;user-select:none}
.hc-layers{display:grid;flex:1;min-width:0}
.hc-layer{grid-area:1/1;display:flex;align-items:center;gap:8px;min-width:0;transition:opacity .22s,visibility .22s,transform .28s}
.hc-layer .spark{color:var(--accent)}
.hc-tt{display:flex;flex-direction:column;min-width:0}
.hc-tt b{font-size:13px;font-weight:700;color:#f2f2f2;white-space:nowrap}
.hc-tt small{font-size:10.5px;color:#8e8e8e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-layer.mini{opacity:0;visibility:hidden;transform:translateY(5px)}
.hc.collapsed .hc-layer.full{opacity:0;visibility:hidden;transform:translateY(-5px)}
.hc.collapsed .hc-layer.mini{opacity:1;visibility:visible;transform:none}
.mini-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:#cfcfcf;min-width:0}
.mini-t .k{font-weight:700}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}.t-wait{color:var(--wait)}.t-acc{color:var(--accent)}
.hc-tg{width:26px;height:26px;border:0;background:none;border-radius:4px;color:#a8a8a8;display:grid;place-items:center;transition:transform .32s,background .15s;flex:none}
.hc-top:hover .hc-tg{background:#2f2f2f}
.hc.collapsed .hc-tg{transform:rotate(180deg)}
.hc-body{padding:0 10px 4px}
.hc-st{display:flex;align-items:center;gap:8px;margin:2px 0 9px;font-size:11px;color:#8e8e8e}

.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px 0 7px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.wait{background:var(--wait-bg);color:var(--wait)}
.pill.wait i{animation:pulse 1.2s infinite}

.reveal{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .36s cubic-bezier(.2,.7,.2,1),opacity .26s ease}
.reveal.open{grid-template-rows:1fr;opacity:1}
.reveal-in{min-height:0;overflow:hidden}
.fade-in{animation:fadeIn .3s ease}

.plq{display:flex;gap:8px;align-items:flex-start;border-radius:5px;padding:8px 9px;margin-bottom:10px;font-size:12px;border:1px solid}
.plq .ico{margin-top:1px;width:14px;height:14px}
.plq b{display:block;font-weight:650;line-height:1.35}
.plq span{display:block;opacity:.85;font-size:11.5px;margin-top:2px}
.plq .lnk{display:inline-block;margin-top:4px;font-size:11.5px}
.plq.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.plq.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.plq.info{background:var(--info-bg);border-color:var(--info-line);color:var(--info)}

.conf{margin-bottom:8px}
.tline{display:flex;align-items:center;justify-content:space-between;gap:2px;min-height:26px;margin:0 -4px}
.tsel,.tconf{height:26px;border:0;background:none;border-radius:4px;padding:0 4px;display:inline-flex;align-items:center;gap:2px;white-space:nowrap;transition:background .15s}
.tsel:hover,.tconf:hover,.tsel[aria-expanded="true"]{background:#303030}
.tsel{font-size:12.5px;font-weight:700;color:#f2f2f2;min-width:0}
.tsel .ico{width:10px;height:10px;color:#9a9a9a}
.tsep{color:#5c5c5c}
.tconf{font-size:11.5px;color:#a6a6a6}
.tconf span{border-bottom:1px dotted #6b6b6b}
.tconf b{font-size:12.5px;color:var(--ok);font-variant-numeric:tabular-nums;margin-left:3px}
.cbd{padding:8px 9px;background:#1b1b1b;border:1px solid #2e2e2e;border-radius:5px;margin-top:5px}
.cbar{display:flex;gap:2px;height:5px;margin-bottom:7px}
.cbar i{border-radius:2px;background:#3a3a3a}
.cbar i.ok{background:var(--ok)}
.cbar i.warn{background:repeating-linear-gradient(135deg,#e2b046 0 3px,#5a4a22 3px 6px)}
.clist{list-style:none;margin:0;padding:0;font-size:12px}
.clist li{display:grid;grid-template-columns:14px 1fr auto;gap:6px;align-items:start;padding:2px 0;color:#d6d6d6}
.clist .ci{display:grid;place-items:center;height:17px}
.clist .ci .ico{width:12px;height:12px;stroke-width:2.2}
.clist li.ok .ci{color:var(--ok)}
.clist li.warn .ci{color:var(--warn)}
.clist .cw{color:#8e8e8e;font-variant-numeric:tabular-nums;white-space:nowrap}
.clist li.ok .cw{color:var(--ok)}
.ctot{display:flex;justify-content:space-between;font-size:12px;color:#bdbdbd;border-top:1px solid #2e2e2e;margin-top:6px;padding-top:5px}
.ctot b{color:var(--ok)}

.draft{background:#1a1a1a;border:1px solid #333;border-radius:5px;padding:9px 10px 8px;margin-bottom:9px;transition:border-color .2s,box-shadow .2s,opacity .3s}
.draft-text{font-size:14px;line-height:1.5;color:#f2f2f2;overflow-wrap:anywhere}
.sub{background:rgba(138,146,255,.2);border-bottom:1px dotted #a3a9ff;border-radius:2px;padding:0 2px;cursor:help;transition:background .15s;color:#fff}
.sub:hover,.sub:focus{background:rgba(138,146,255,.34);outline:none}
.sub.warn{background:rgba(242,198,92,.16);border-bottom-color:#e0b040}
.sub.warn:hover,.sub.warn:focus{background:rgba(242,198,92,.28)}
.draft-foot{margin-top:7px;font-size:11px;color:#8e8e8e}
.rid-b{border:0;background:none;color:#a3a9ff;font:inherit;padding:0;cursor:pointer;text-decoration:underline dotted}
.cwarn{list-style:none;margin:2px 0 7px;padding:0;font-size:11.5px;line-height:1.35;color:var(--warn)}
.cwarn li{display:flex;gap:5px;align-items:flex-start}
.cwarn svg{width:13px;height:13px;flex:none;margin-top:1px}
.conf.open .cwarn{display:none}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}
.draft.sent{opacity:.7}
.draft.editing{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.draft-edit{display:block;width:100%;border:0;background:transparent;font:inherit;font-size:14px;line-height:1.5;resize:none;outline:0;padding:0;color:#f2f2f2;min-height:96px}

.actions{display:flex;gap:6px;margin-bottom:10px}
.actions .btn{flex:1;min-width:0}
.hint-sm{font-size:11px;color:#8e8e8e;margin:-4px 0 10px}
.note-row{display:flex;align-items:center;gap:6px;background:var(--accent-soft);color:#c9cdff;border-radius:5px;padding:5px 5px 5px 8px;font-size:12px;margin-bottom:10px;animation:fadeIn .25s;flex-wrap:wrap}
.note-row>span{flex:1;min-width:120px}
.sent-line{display:flex;align-items:center;gap:5px;color:var(--ok);font-size:12.5px;margin-bottom:7px}
.sent-line .ico{stroke-width:2.2;width:14px;height:14px}
.sent-line span{color:#a6a6a6}

.stages{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:12px;color:#cfcfcf;margin-bottom:9px}
.st{display:inline-flex;align-items:center;gap:4px}
.st .ico{width:12px;height:12px;stroke-width:2.2}
.st.done{color:var(--ok)}
.st.run{color:var(--wait)}
.stages .sep{color:#555}
.skel{display:grid;gap:8px;padding:11px 10px;border:1px dashed #3a3a3a;border-radius:5px;margin-bottom:10px}
.skel i{height:9px;border-radius:5px;background:linear-gradient(90deg,#2c2c2c 0%,#3a3a3a 50%,#2c2c2c 100%);background-size:200% 100%;animation:shimmer 1.5s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

.fold{border-top:1px solid #333}
.fold-h{width:100%;display:flex;align-items:center;gap:4px;border:0;background:none;padding:8px 0;font-size:12px;font-weight:650;color:#dcdcdc;text-align:left}
.fold-h>span:first-child{flex:none}

.fact{display:grid;grid-template-columns:70px minmax(0,1fr) 22px;gap:6px;align-items:start;padding:3px 0;font-size:12px}
.fk{color:#9a9a9a}
.fv{color:#ececec;font-weight:600}
.fopen{color:#3d9bff;text-decoration:none;font-weight:700;margin-left:3px;font-size:12px}
.fopen:hover{text-decoration:underline}
.fv small{display:block;font-size:10.5px;color:#868686;font-weight:400}
.fv small.w{color:var(--warn)}
.flag{width:22px;height:20px;border:0;background:none;color:#6e6e6e;border-radius:4px;display:grid;place-items:center;opacity:.7;transition:opacity .15s,background .15s,color .15s}
.flag .ico{width:13px;height:13px}
.fact:hover .flag,.flag:focus-visible{opacity:1}
.flag:hover{background:#303030;color:#bdbdbd}
.fact.flagged .flag{color:var(--bad);opacity:1}
.fact.flagged .flag .fl{fill:currentColor}
.fact.flagged .fv small{color:var(--bad)}
.why-lead{margin:0 0 5px;font-size:12px;color:#ececec}
.why{margin:0;padding:0;list-style:none;font-size:11.5px;color:#bdbdbd}
.why li{padding:2px 0}
.why b{color:#e6e6e6;font-weight:600}
.topic-only{font-size:12px;color:#a6a6a6;margin:0 0 9px}
.topic-only b{color:#ececec}
.fb-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb-hint{font-size:11px;color:#8e8e8e;display:inline-flex;align-items:center;gap:3px}
.fb-hint .ico{width:11px;height:11px}
.fb-done{display:flex;align-items:flex-start;gap:6px;font-size:11.5px;color:#d6d6d6;background:#1b1b1b;border-radius:5px;padding:6px 8px}
.fb-done>.ico{color:var(--ok);margin-top:1px;width:13px;height:13px;stroke-width:2.2}
.fb-done span{flex:1}

.ud{padding:0 2px}
.ud-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;text-transform:uppercase;color:#d8d8d8;padding:2px 0 8px;margin-bottom:6px;border-bottom:1px solid #2c2c2c}
.ud-head .lnk{text-transform:none;font-size:11.5px;text-decoration:underline}
.ud-f{position:relative;margin-bottom:11px;padding-right:30px}
.ud-l{font-size:9.5px;text-transform:uppercase;color:#8d8d8d;letter-spacing:.01em;margin-bottom:1px}
.ud-v{font-size:13px;color:#f2f2f2;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ud-v .lnk{font-weight:500}
.ud-v.multi{white-space:normal;line-height:1.35}
.ud-v.dash{font-weight:400;color:#cfcfcf}
.ud-f.subf{margin-left:2px;padding-left:10px;border-left:2px solid #3e3e3e}
.ud-plus{position:absolute;right:2px;top:4px;width:22px;height:22px;border:0;border-radius:2px;background:#2f2f2f;color:#e0e0e0;display:grid;place-items:center}
.ud-plus .ico{width:13px;height:13px}
.ud-plus.hl{background:var(--accent-btn);color:#fff;box-shadow:0 0 0 3px var(--accent-ring)}

.tabs{display:flex;gap:2px;padding:4px 10px 0;border-bottom:1px solid #2e2e2e;position:sticky;top:0;background:var(--side);z-index:2}
.tab{border:0;background:none;padding:7px 10px 8px;font-size:12.5px;font-weight:650;color:#9a9a9a;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;margin-bottom:-1px}

.tab.on{color:#f2f2f2;border-bottom-color:var(--accent)}
.tdot{width:7px;height:7px;border-radius:50%;background:#666}

.pane.on{display:block;animation:fadeIn .22s ease}
.v3-head{display:flex;align-items:center;gap:8px;margin:2px 0 6px}
.v3-head .spark{color:var(--accent)}
.v3 .fact{grid-template-columns:84px minmax(0,1fr) 22px}
.hist{list-style:none;margin:0;padding:0}

.hist b{font-weight:600;display:block;color:#ececec}
.hist small{font-size:11px;color:#9a9a9a}
.hist li.cur small{color:var(--ok)}
.hist li.old{opacity:.65}

.pop-n{font-size:11px;color:#8e8e8e;padding:6px 8px 2px;border-top:1px solid #383838;margin-top:4px}

function lev(a, b) {
  const n = b.length;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const row = [i];
    for (let j = 1; j <= n; j++) {
      row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = row;
  }
  return prev[n];
}
function editLabel(text, base) {
  if (!base) return 'ответ вручную';
  const d = lev(text.trim(), base.trim());
  if (d === 0) return 'без правок';
  return `правка ${Math.max(1, Math.round(d / Math.max(base.length, 1) * 100))}%`;
}

/* ---------- анимация высоты ---------- */
function morph(el, mutate) {
  if (RM || !el.isConnected) { mutate(); return; }
  const h0 = el.offsetHeight;
  clearTimeout(el._mt);
  el.style.transition = 'none';
  el.style.height = '';
  el.style.overflow = '';
  mutate();
  const h1 = el.offsetHeight;
  el.classList.remove('fade-in');
  void el.offsetWidth;
  el.classList.add('fade-in');
  if (Math.abs(h1 - h0) < 2) { el.style.transition = ''; return; }
  el.style.height = h0 + 'px';
  el.style.overflow = 'hidden';
  void el.offsetHeight;
  el.style.transition = 'height .36s cubic-bezier(.2,.7,.2,1)';
  el.style.height = h1 + 'px';
  el._mt = setTimeout(() => { el.style.height = ''; el.style.overflow = ''; el.style.transition = ''; }, 400);
}

    noid: ['warn', I.idcard, 'Нет ID Умскул - заполните почту в карточке клиента, подсказка обновится сама', ''],
    appended: ['info', I.refresh, 'Клиент дописал 14:05 - черновик обновлён', ''],
  }[S.state];
  if (!m) return '';
  const extra = (S.state === 'noid' && V === 'v3') ? '<button class="lnk" data-act="tab" data-k="client">Открыть данные клиента</button>' : '';
  return `<div class="plq ${m[0]}" role="status">${m[1]}<div><b>${m[2]}</b>${m[3] ? `<span>${m[3]}</span>` : ''}${extra}</div></div>`;
}
function tlineHTML(d) {
  const p = confPct(d.conf);
  const icon = {ok: I.check, warn: I.warn};
  const o = S.open.conf;
  const bd = `<div class="cbd">
      <span class="cbar" aria-hidden="true">${d.conf.map(x => `<i class="${x[2] === x[3] ? 'ok' : x[0]}" style="flex:${x[3]}"></i>`).join('')}</span>
      <ul class="clist">${d.conf.map(x => `<li class="${x[0]}"><span class="ci">${icon[x[0]]}</span><span>${x[1]}</span><span class="cw">${x[2] === x[3] ? '+' + x[2] : `0 из ${x[3]}`}</span></li>`).join('')}</ul>
      <div class="ctot"><span>Уверенность</span><b>${p}%</b></div></div>`;
  return `<div class="conf${o ? ' open' : ''}" data-fold="conf">
    <div class="tline">
      <button class="tsel" data-act="topic" data-pop aria-haspopup="menu" aria-expanded="false" title="${d.name} · ${d.sub} - выбрать другую тему">${d.name}${I.chevDown}</button>
      <button class="tconf" data-act="fold" data-k="conf" aria-expanded="${o}" title="Из чего сложилась уверенность"><span>уверенность</span><b>${p}%</b></button>
    </div>
    ${p < 100 ? `<ul class="cwarn">${d.conf.filter(x => x[0] === 'warn').map(x => `<li>${I.warn}<span>${x[1]}</span></li>`).join('')}</ul>` : ''}
    <div class="reveal${o ? ' open' : ''}"><div class="reveal-in">${bd}</div></div></div>`;
}
function ridHTML() {
  return `<span class="rid">· ID ответа <button class="rid-b" data-act="copy-rid" title="Скопировать ID ответа - приложите его к обратной связи">${rid()}</button></span>`;
}
function draftHTML(d) {
  if (V === 'v1' && S.editMode === 'card') {
    return `<div class="draft editing"><textarea class="draft-edit" aria-label="Черновик ответа" spellcheck="false">${esc(S.cardText)}</textarea>
      <div class="draft-foot">Шаблон КС «${d.tpl}» · правка в карточке ${ridHTML()}</div></div>`;
  }
  return `<div class="draft"><div class="draft-text">${partsHTML(d.draft)}</div>
    <div class="draft-foot">Шаблон КС «${d.tpl}» · <span class="c-ok">✓ ${d.check}</span> ${ridHTML()}</div></div>`;
}
function actionsHTML(d) {
  const v2stale = V === 'v2' && S.stale;
  if (S.phase === 'inserted' && !v2stale) {
    const undo = V === 'v2' ? '' : `<button class="btn sm" data-act="undo">${I.undo}Вернуть как было</button>`;
    return `<div class="note-row">${I.pencil}<span>Вставлено - правьте в поле ответа</span>${undo}</div>`;
  }
  if (V === 'v1' && S.editMode === 'card') {
    const changed = S.cardText !== partsText(d.draft);
    return `<div class="actions"><button class="btn primary" data-act="send" title="Отправить клиенту"${S.cardText.trim() ? '' : ' disabled'}>Отправить</button>
      <button class="btn" data-act="cancel-edits"${changed ? '' : ' disabled'}>Отменить правки</button></div>`;
  }
  if (V === 'v2') return `<div class="actions"><button class="btn" data-act="edit" title="Вставить в поле ответа">${I.pencil}Изменить</button></div>`;
  return `<div class="actions"><button class="btn primary" data-act="send" title="Отправить клиенту">${I.send}Отправить</button><button class="btn" data-act="edit" title="Вставить в поле ответа">${I.pencil}Изменить</button></div>`;
}
function factRow(f) {
  const fl = !!S.flags[f.k];
  return `<div class="fact${fl ? ' flagged' : ''}"><span class="fk">${f.l}</span>
    <span class="fv">${f.v}${f.url ? ` <a class="fopen" href="${f.url}" target="_blank" rel="noopener" title="Открыть в платформе для сверки" aria-label="Открыть в платформе - ${f.l}">↗</a>` : ''}<small class="${f.w ? 'w' : ''}" data-m="${esc(f.m)}">${fl ? 'отмечено: неверный факт' : f.m}</small></span>
    <button class="flag" data-act="flag" data-k="${f.k}" title="Отметить: неверный факт" aria-label="Отметить: неверный факт - ${f.l}" aria-pressed="${fl}">${I.flag}</button></div>`;
}
function factsHTML() {
  const list = V === 'v3' ? FACTS.concat(FACTS_MORE) : FACTS;
  const ok = list.filter(f => !f.w).length, w = list.length - ok;
  const summary = `<span class="c-ok">${ok} ${plural(ok, 'факт', 'факта', 'фактов')} ✓</span>${w ? ` · ${w} ${plural(w, 'уточняется', 'уточняются', 'уточняются')}` : ''}`;
  return fold('facts', 'Из платформы', `<div class="facts">${list.map(factRow).join('')}</div>`, summary);
}
function whyHTML(why) {
  return fold('why', 'Почему так', `<p class="why-lead">${why.lead}</p><ul class="why">${why.items.map(([k, v]) => `<li><b>${k}</b> - ${v}</li>`).join('')}</ul>`);
}
function fbInner() {
  if (S.bad) return `<div class="fb-done">${I.check}<span>Отмечено: ${esc(S.bad)}. Отзыв ушёл с ID ответа ${rid()} - учтём при доработке шаблонов.</span><button class="lnk" data-act="unbad">Отменить</button></div>`;
  return `<div class="fb-row"><button class="btn sm" data-act="bad" data-pop aria-haspopup="menu" aria-expanded="false">${I.thumb}Плохо${I.chevDown}</button>
    <span class="fb-hint">или ${I.flag} у строки в «Из платформы» · ID ответа ${rid()} приложится сам</span></div>`;
}
function fbHTML() { return fold('fb', 'Отзыв', `<div id="fbBox">${fbInner()}</div>`, S.bad ? 'отмечено' : ''); }
function historyHTML() {
  const d = cur();
  let name = d.name, st;
  if (S.phase === 'sent') st = `отправлен ${S.sent.time} · ${S.sent.edit}`;
  else if (S.state === 'preparing' || S.rebuilding) { st = 'готовится'; if (S.state === 'preparing') name = 'Тема определяется'; }
  else if (S.state === 'self') { name = 'Возврат денег'; st = 'без черновика - ответьте сами'; }
  else if (S.state === 'noid') st = 'без черновика - нет ID Умскул';
  else st = `текущий · ${confPct(d.conf)}%`;
  const rows = [[MSG_TIME[S.state], name, st, S.phase === 'sent' ? 'done' : 'cur']];
  rows.push(S.state === 'appended'
    ? ['14:02', 'Ссылка на занятие', 'устарел - клиент дописал', 'old']
    : ['10:16', 'Домашнее задание', 'отправлен 10:21 · правка 12%', 'done']);
  return fold('hist', 'История черновиков', `<ul class="hist">${rows.map(r => `<li class="${r[3]}"><span class="h-t">${r[0]}</span><span><b>${r[1]}</b><small>${r[2]}</small></span></li>`).join('')}</ul>`, '2 по обращению');
}
const stagesHTML = () => `<div class="stages"><span class="st done">${I.check}переписка</span><span class="sep">·</span><span class="st done">${I.check}данные</span><span class="sep">·</span><span class="st run"><i class="spin"></i>тема …</span></div>`;
const skelHTML = note => `<div class="skel" aria-hidden="true"><i style="width:92%"></i><i style="width:100%"></i><i style="width:74%"></i><i style="width:46%"></i></div><div class="hint-sm">${note}</div>`;

function bodyHTML() {
  const st = S.state, v3 = V === 'v3', out = [statusRow()];
  const tail = why => { out.push(whyHTML(why)); if (v3) out.push(historyHTML()); out.push(fbHTML()); };
  if (S.phase === 'sent') {
    out.push(`<div class="sent-line">${I.check}<b>Отправлено ${S.sent.time}</b><span>· ${S.sent.edit}</span></div>
      <div class="draft sent"><div class="draft-text">${esc(S.sent.text)}</div><div class="draft-foot">Ушло во ВКонтакте · автор - Мария С.</div></div>`, factsHTML());
    tail(cur().why);
    return out.join('');
  }
  out.push(plaqueHTML());
  if (S.rebuilding) {
    out.push(`<div class="stages"><span class="st run"><i class="spin"></i>${S.rebuilding.text}</span></div>${skelHTML(S.rebuilding.note)}`);
    return out.join('');
  }
  if (st === 'preparing') {
    out.push(stagesHTML() + skelHTML('Можно отвечать самим - поле ответа не трогаем'), factsHTML());
    if (v3) out.push(historyHTML());
    return out.join('');
  }
  if (st === 'self') {
    out.push(factsHTML());
    tail(WHY_SELF);
    return out.join('');
  }
  if (st === 'noid') {
    out.push(`<p class="topic-only">Тема: <b>${TOPICS.link.name}</b></p>`);
    tail(WHY_NOID);
    return out.join('');
  }
  const d = cur();
  out.push(tlineHTML(d), draftHTML(d), actionsHTML(d), factsHTML());
  tail(d.why);
  return out.join('');
}

function renderCard(animate = true) {
  closePop();
  hideTip();
  renderHeader();
  const body = $('#cardBody');
  const apply = () => {
    body.innerHTML = bodyHTML();
    const ta = $('.draft-edit', body);
    if (ta) autosize(ta, 360);
  };
  if (!animate || S.collapsed) apply(); else morph(body, apply);
}

function setCollapsed(c) {
  if (V === 'v3') return;
  S.collapsed = c;
  hideTip();
  closePop();
  $('#card').classList.toggle('collapsed', c);
  $('#cardReveal').classList.toggle('open', !c);
  const tg = $('#hcTg');
  tg.setAttribute('aria-expanded', String(!c));
  tg.setAttribute('aria-label', c ? 'Развернуть подсказку' : 'Свернуть подсказку');
}

function toggleFold(k) {
  S.open[k] = !S.open[k];
  hideTip();
  const w = document.querySelector(`[data-fold="${k}"]`);
  if (!w) return;
  w.classList.toggle('open', S.open[k]);
  w.querySelector('.reveal').classList.toggle('open', S.open[k]);
  $$(`[data-act="fold"][data-k="${k}"]`, w).forEach(h => h.setAttribute('aria-expanded', String(S.open[k])));
}
function toggleFlag(k, btn) {
  S.flags[k] = !S.flags[k];
  const row = btn.closest('.fact');
  row.classList.toggle('flagged', S.flags[k]);
  btn.setAttribute('aria-pressed', String(S.flags[k]));
  const m = row.querySelector('small');
  m.textContent = S.flags[k] ? 'отмечено: неверный факт' : m.dataset.m;
}
function renderFb() {
  const box = $('#fbBox');
  if (box) morph(box, () => { box.innerHTML = fbInner(); });
  const s = $('[data-fold="fb"] .fold-h');
  if (!s) return;
  const old = $('.fold-s', s);
  if (old) old.remove();
  if (S.bad) s.querySelector('span').insertAdjacentHTML('afterend', '<span class="fold-s">отмечено</span>');
}

/* ---------- полоса над полем ответа (вариант 2) ---------- */
function renderStrip() {
  if (V !== 'v2') return;
  const el = $('#strip');
  const st = S.state;
  let cls, html;
  if (S.phase === 'sent') {
    cls = 'ok'; html = `${I.check}<b>Отправлено ${S.sent.time}</b><span class="dim">· ${S.sent.edit}</span>`;
  } else if (S.phase === 'inserted' && S.stale) {
    cls = 'warn'; html = `${I.warn}<b>Клиент дописал 14:05 - черновик устарел</b><span class="sp"></span><button class="btn xs primary" data-act="replace">Заменить на новый</button>`;
  } else if (S.phase === 'inserted') {
    cls = 'guard'; html = `${I.pencil}<span>Вставлен черновик к сообщению <b>${S.insertedFor}</b></span><span class="sp"></span><button class="btn xs" data-act="undo">${I.undo}Вернуть как было</button>`;
  } else if (S.rebuilding || st === 'preparing') {
    cls = 'wait'; html = `<i class="spin"></i><b>Подсказка готовится</b><span class="dim">· ${S.rebuilding ? S.rebuilding.short : 'переписка ✓ · данные ✓ · тема …'}</span>`;
  } else if (st === 'self') {
    cls = 'bad'; html = `${I.stop}<b>Ответьте сами: просит вернуть деньги</b>`;
  } else if (st === 'noid') {
    cls = 'warn'; html = `${I.idcard}<b>Нет ID Умскул</b><span class="dim">· заполните почту в карточке клиента, подсказка обновится сама</span>`;
  } else {
    const d = cur();
    cls = 'ready'; html = `${I.spark}<b>Подсказка готова</b><span class="dim">· ${d.name} · ${confPct(d.conf)}%</span><span class="sp"></span><button class="btn xs primary" data-act="send" title="Отправить клиенту">${I.send}Отправить</button><button class="btn xs" data-act="edit" title="Вставить в поле ответа">${I.pencil}Изменить</button>`;
  }
  el.hidden = false;
  el.className = 'strip ' + cls;
  el.innerHTML = html;
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';
}

/* ---------- действия ---------- */
async function cardSend() {
  if (S.phase === 'sending' || S.phase === 'sent') return;
  const tok = S.tok;
  const base = partsText(cur().draft);
  const text = (V === 'v1' && S.editMode === 'card') ? S.cardText.trim() : base;
  if (!text) return;
  S.phase = 'sending';
  closePop();
  hideTip();
  $$('[data-act="send"]').forEach(b => { b.disabled = true; b.innerHTML = '<i class="spin"></i>Отправляю…'; });
  $$('[data-act="edit"],[data-act="cancel-edits"]').forEach(b => { b.disabled = true; });
  const r = $('#reply'), box = $('#replyBox');
  r.value = text;
  updReply();
  box.classList.add('flash');
  await wait(750);
  if (tok !== S.tok) return;
  box.classList.add('fly');
  await wait(270);
  if (tok !== S.tok) return;
  r.value = '';
  updReply();
  box.classList.remove('fly', 'flash');
  addOut(text);
  finishSent(text, base);
}
function finishSent(text, base) {
  S.phase = 'sent';
  S.stale = false;
  S.sent = {time: SENT_TIME, text, edit: editLabel(text, base)};
  renderCard();
  renderStrip();
  if (V === 'v3') return;
  const tok = S.tok;
  setTimeout(() => { if (tok === S.tok && S.phase === 'sent') setCollapsed(true); }, RM ? 0 : 700);
}
function odSend() {
  const r = $('#reply');
  const text = r.value.trim();
  if (!text || S.phase === 'sending') return;
  addOut(text);
  r.value = '';
  updReply();
  if (S.phase === 'inserted') finishSent(text, S.insertedText);
}
function insertDraft() {
  if (S.phase === 'sending' || S.phase === 'sent') return;
  const r = $('#reply'), box = $('#replyBox');
  if (S.phase !== 'inserted') S.prevReply = r.value;
  const text = partsText(cur().draft);
  r.value = text;
  updReply();
  S.insertedText = text;
  S.insertedFor = MSG_TIME[S.state];
  S.phase = 'inserted';
  S.stale = false;
  box.classList.add('flash');
  setTimeout(() => box.classList.remove('flash'), RM ? 0 : 900);
  r.focus({preventScroll: true});
  r.setSelectionRange(text.length, text.length);
  renderCard();
  renderStrip();
}
function undoInsert() {
  const r = $('#reply');
  r.value = S.prevReply || '';
  updReply();
  S.phase = 'idle';
  S.stale = false;
  S.insertedText = null;
  renderCard();
  renderStrip();
}
async function rebuild(info, apply) {
  const tok = ++S.tok;
  apply();
  S.rebuilding = info;
  renderCard();
  renderStrip();
  await wait(info.ms);
  if (tok !== S.tok) return;
  S.rebuilding = null;
  S.cardText = partsText(cur().draft);
  renderCard();
  renderStrip();
  renderClient();
}
function pickTopic(k) {
  if (k === S.topic || S.phase === 'sending') return;
  if (S.phase === 'inserted') undoInsert();
  const name = TOPICS[k].name;
  rebuild({text: `Пересобираю по теме «${name}»`, note: 'По шаблону КС этой темы, без модели', short: `тема «${name}»`, ms: 950}, () => { S.topic = k; });
}
function addEmail() {
  rebuild({text: 'В карточке появился ID Умскул - собираю подсказку', note: 'Обновилась сама после записи в карточку клиента', short: 'ID Умскул найден', ms: 1300}, () => {
    S.email = true;
    S.state = 'ready';
    markSeg('ready');
    renderClient();
  });
}
function setState(k) {
  S.tok++;
  Object.assign(S, {
    state: k, topic: 'link', phase: 'idle', stale: false, rebuilding: null, email: false,
    open: Object.assign({}, OPEN_DEFAULT),
    bad: null, flags: {}, sent: null, out: [], insertedText: null, insertedFor: null, prevReply: '',
  });
  S.cardText = partsText(cur().draft);
  const r = $('#reply');
  r.value = '';
  $('#replyBox').classList.remove('flash', 'fly');
  if (V === 'v2' && k === 'appended') {
    const old = partsText(TOPICS.link.draft);
    r.value = old;
    Object.assign(S, {insertedText: old, insertedFor: '14:02', phase: 'inserted', stale: true});
  }
  updReply();
  renderFeed();
  renderClient();
  if (S.collapsed) setCollapsed(false);
  renderCard();
  renderStrip();
  markSeg(k);
}
function setEditMode(k) {
  S.editMode = k;
  $$('#segEdit button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  setState(S.state);
}
function setTab(k) {
  if (V !== 'v3') return;
  S.tab = k;
  hideTip();
  closePop();
  $$('.tab').forEach(t => { const on = t.dataset.k === k; t.classList.toggle('on', on); t.setAttribute('aria-selected', String(on)); });
  $('#pane-client').classList.toggle('on', k === 'client');
  $('#pane-hint').classList.toggle('on', k === 'hint');
  $('#side').scrollTop = 0;
}
function updCardEditBtns() {
  const send = $('#card [data-act="send"]'), cancel = $('#card [data-act="cancel-edits"]');
  if (S.phase === 'sending') return;
  if (send) send.disabled = !S.cardText.trim();
  if (cancel) cancel.disabled = S.cardText === partsText(cur().draft);
}

/* ---------- всплывающая подсказка источника ---------- */
const tip = $('#tip');
function showTip(el) {
  tip.innerHTML = `<b>${esc(el.dataset.what)}</b><span>${esc(el.dataset.src)}</span>${el.dataset.note ? `<em>${esc(el.dataset.note)}</em>` : ''}`;
  tip.classList.add('open');
  const r = el.getClientRects()[0] || el.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  const left = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, window.innerWidth - tw - 8));
  let top = r.top - th - 8;
  if (top < 8) top = r.bottom + 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
function hideTip() { tip.classList.remove('open'); }
document.addEventListener('mouseover', e => { const s = e.target.closest('.sub'); if (s) showTip(s); });
document.addEventListener('mouseout', e => { const s = e.target.closest('.sub'); if (s && !s.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('sub')) showTip(e.target); });
document.addEventListener('focusout', e => { if (e.target.classList && e.target.classList.contains('sub')) hideTip(); });

/* ---------- меню ---------- */
const pop = $('#pop');
let popAnchor = null;
function openPop(anchor, html) {
  if (popAnchor === anchor) { closePop(); return; }
  closePop();
  pop.innerHTML = html;
  pop.classList.add('open');
  popAnchor = anchor;
  anchor.setAttribute('aria-expanded', 'true');
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  const left = Math.max(8, Math.min(r.left, window.innerWidth - pw - 8));
  let top = r.bottom + 6;
  if (top + ph > window.innerHeight - 60) top = Math.max(8, r.top - ph - 6);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}
function closePop() {
  if (!popAnchor) return;
  pop.classList.remove('open');
  if (popAnchor.isConnected) popAnchor.setAttribute('aria-expanded', 'false');
  popAnchor = null;
}
const topicPop = () => `<div class="pop-t">Другая тема</div>${Object.entries(TOPICS).filter(([k]) => k !== S.topic).map(([k, t]) => `<button class="pop-i" data-act="pick-topic" data-k="${k}">${t.name}</button>`).join('')}<div class="pop-n">Пересоберу по шаблону КС этой темы, без модели</div>`;
const badPop = () => `<div class="pop-t">Что не так</div>${BAD.map(r => `<button class="pop-i" data-act="pick-bad" data-v="${r}">${cap(r)}</button>`).join('')}`;

/* ---------- обработчики ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (popAnchor && !e.target.closest('#pop') && a !== popAnchor) closePop();
  if (!a || a.disabled) return;
  const k = a.dataset.k;
  switch (a.dataset.act) {
    case 'toggle': setCollapsed(!S.collapsed); break;
    case 'fold': toggleFold(k); break;
    case 'topic': openPop(a, topicPop()); break;
    case 'pick-topic': closePop(); pickTopic(k); break;
    case 'bad': openPop(a, badPop()); break;
    case 'pick-bad': closePop(); S.bad = a.dataset.v; renderFb(); break;
    case 'unbad': S.bad = null; renderFb(); break;
    case 'copy-rid': { const t = a.textContent; try { navigator.clipboard && navigator.clipboard.writeText(t); } catch (err) {} a.textContent = 'скопировано'; setTimeout(() => { a.textContent = t; }, 1200); break; }
    case 'flag': toggleFlag(k, a); break;
    case 'send': cardSend(); break;
    case 'edit': insertDraft(); break;
    case 'replace': insertDraft(); break;
    case 'undo': undoInsert(); break;
    case 'cancel-edits': S.cardText = partsText(cur().draft); renderCard(); break;
    case 'od-send': odSend(); break;
    case 'od-status': $$('.st-b').forEach(b => b.classList.toggle('on', b === a && !a.classList.contains('on'))); break;
    case 'add-email': if (V === 'v3') setTab('hint'); addEmail(); break;
    case 'tab': setTab(k); break;
    case 'state': setState(k); break;
    case 'editmode': setEditMode(k); break;
    case 'reset': setState('ready'); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'reply') updReply();
  if (e.target.classList.contains('draft-edit')) {
    S.cardText = e.target.value;
    autosize(e.target, 360);
    updCardEditBtns();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePop(); hideTip(); } });
window.addEventListener('resize', () => { closePop(); hideTip(); });
document.addEventListener('scroll', e => { if (!pop.contains(e.target)) { closePop(); hideTip(); } }, true);

/* ---------- старт ---------- */
buildChrome();
buildSide();
buildMock();
S.cardText = partsText(cur().draft);
renderFeed();
renderClient();
renderCard(false);
renderStrip();
updReply();
const START = new URLSearchParams(location.search).get('state');
if (START && START !== 'ready' && MSG_TIME[START]) setState(START);
})();
</script>
